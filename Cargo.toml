[package]
name = "relic"
version = "0.1.0"
edition = "2024"
autobenches = false

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
blake3 = { version = "1", default-features = false }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events", "bracketed-paste"] }
getrandom = "0.4"
libc = "0.2"
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
rusqlite = { version = "0.35", features = ["bundled", "hooks", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[[bin]]
name = "relic"
path = "src/main.rs"

[lib]
bench = false

[dev-dependencies]
tempfile = "3"

# The bench programs are examples so they build against dev-dependencies and
# stay out of the shipped crate.
[[example]]
name = "gates"
path = "benches/gates.rs"
test = true

# Builds the deterministic 100k/1M fixture databases for #10.
[[example]]
name = "fixture_db"
path = "benches/fixture_db.rs"

# Search-as-you-type FTS variants and their size/latency cost for #10/#11.
[[example]]
name = "interactive_fts"
path = "benches/interactive_fts.rs"
test = true
