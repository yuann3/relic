[package]
name = "relic"
version = "0.1.0"
edition = "2024"
autobenches = false

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
blake3 = { version = "1", default-features = false }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events", "bracketed-paste"] }
getrandom = "0.4"
libc = "0.2"
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
rusqlite = { version = "0.35", features = ["bundled", "hooks", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Patterns a review found shipped; `cargo clippy -- -D warnings` fails on
# any new one. An exception says why with `#[expect(..., reason = ...)]`.
[lints.clippy]
# A `Display` that writes `{self:?}` showed users a Rust dump such as
# `UncitedClaim { claim_text: .. }`. Write the sentence.
use_debug = "warn"
# A panic for a state a guard elsewhere rules out: return the error the
# guard would, so moving the guard cannot crash Relic.
unreachable = "warn"
# `.map(|s| s.as_str())` where `.map(String::as_str)` names the method.
redundant_closure_for_method_calls = "warn"
# `s.push_str(&format!(..))` builds a String only to copy it; `write!` into s.
format_push_string = "warn"
# A unit expression left without `;` reads as a value the block returns.
semicolon_if_nothing_returned = "warn"
# `x as u64` where `u64::from(x)` cannot truncate: an `as` there hides the
# one cast that can, once a type changes.
cast_lossless = "warn"
# `.map(f).unwrap_or(a)` is `.map_or(a, f)`.
map_unwrap_or = "warn"
# `for x in v.iter()` is `for x in &v`.
explicit_iter_loop = "warn"
# A stable sort of primitives pays for an order no one can see.
stable_sort_primitive = "warn"
# `.cloned()` on Copy items hides that they are Copy.
cloned_instead_of_copied = "warn"
# `format!("{}", x)` where `format!("{x}")` names the value in place.
uninlined_format_args = "warn"
# A clone of a value that is never used again.
redundant_clone = "warn"

[[bin]]
name = "relic"
path = "src/main.rs"

[lib]
bench = false

[dev-dependencies]
tempfile = "3"

# The bench programs are examples so they build against dev-dependencies and
# stay out of the shipped crate.
[[example]]
name = "gates"
path = "benches/gates.rs"
test = true

# Builds the deterministic 100k/1M fixture databases for #10.
[[example]]
name = "fixture_db"
path = "benches/fixture_db.rs"

# Search-as-you-type FTS variants and their size/latency cost for #10/#11.
[[example]]
name = "interactive_fts"
path = "benches/interactive_fts.rs"
test = true
