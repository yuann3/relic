[package]
name = "relic"
version = "0.1.0"
edition = "2024"
autobenches = false

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm_0_29"] }
rusqlite = { version = "0.35", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "relic"
path = "src/main.rs"

[lib]
bench = false

[[bin]]
name = "perf_spike"
path = "benches/perf_spike.rs"
bench = false

# Builds the deterministic 100k/1M fixture databases for #10.
[[bin]]
name = "fixture_db"
path = "benches/fixture_db.rs"
bench = false
