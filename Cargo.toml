[package]
name = "relic"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.35", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "relic"
path = "src/main.rs"

[lib]
bench = false

[[bin]]
name = "perf_spike"
path = "benches/perf_spike.rs"
bench = false

# PROTOTYPE — delete after P1 is resolved
[[bin]]
name = "jev_spike"
path = "spikes/jev_spike.rs"
