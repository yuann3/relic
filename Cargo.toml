[package]
name = "relic"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.35", features = ["bundled", "modern_sqlite"] }
tempfile = "3"

[[bin]]
name = "relic"
path = "src/main.rs"

[lib]
bench = false

[[bin]]
name = "perf_spike"
path = "benches/perf_spike.rs"
bench = false
